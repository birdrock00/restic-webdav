name: Daily webdav image

on:
  schedule:
    - cron: '40 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream restic master
        run: |
          git config user.name "daily-webdav-workflow"
          git config user.email "daily-webdav-workflow@users.noreply.github.com"
          git remote add upstream https://github.com/restic/restic.git
          # Fetch upstream WITHOUT tags: this fork carries release tags that
          # collide with restic upstream tags of the same name, which makes a
          # --tags fetch abort with "would clobber existing tag" (exit 1).
          git fetch --no-tags upstream master
          before=$(git rev-parse HEAD)
          if git merge --no-edit FETCH_HEAD; then
            :
          else
            # Upstream restic maintains its own .github workflows (each guarded
            # by `if: github.repository == 'restic/restic'`, so they never run
            # in this fork). If their churn conflicts, keep this fork's .github.
            git checkout --ours -- .github || true
            git add .github || true
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "::warning::upstream merge conflicted, building last merged state"
              git merge --abort
            else
              git commit --no-edit
            fi
          fi
          if [ "$(git rev-parse HEAD)" != "$before" ]; then
            # A new merge commit exists. Keep the fork's .github byte-identical
            # before pushing: GITHUB_TOKEN only has `contents: write` (no
            # `workflows`), so pushing any change under .github/workflows from
            # the default branch is rejected by the remote. Upstream workflow
            # churn is irrelevant here anyway - its workflows are all guarded
            # to run only on restic/restic.
            git rm -r --cached -q -- .github
            git restore --source HEAD^1 --staged --worktree -- .github
            git commit --amend --no-edit
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Resolve upstream restic version
        run: |
          docker pull --quiet ghcr.io/restic/restic:latest
          echo "RESTIC_VERSION=$(docker run --rm --platform linux/amd64 --entrypoint /usr/bin/restic ghcr.io/restic/restic:latest version | awk '{print $2}')" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.webdav
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.RESTIC_VERSION }}
            ${{ env.IMAGE_NAME }}:${{ env.RESTIC_VERSION }}-${{ env.BUILD_DATE }}

      - name: Publish daily release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="webdav-${BUILD_DATE}"
          NOTES="restic ${RESTIC_VERSION} image with rclone (WebDAV backend) and curl added.

          Container images (linux/amd64, linux/arm64):
          * \`${IMAGE_NAME}:latest\`
          * \`${IMAGE_NAME}:${RESTIC_VERSION}-${BUILD_DATE}\`"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "restic+webdav ${RESTIC_VERSION} (${BUILD_DATE})" \
              --notes "$NOTES"
          fi
